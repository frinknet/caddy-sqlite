name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gofmt, vet and unit tests
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e GOMODCACHE=/mod -e GOCACHE=/mod/gocache -e CGO_ENABLED=0 \
            caddy:2.11.9-builder-alpine \
            sh -c 'gofmt -l . && go vet ./... && go test -count=1 ./...'

      - name: race detector
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e GOMODCACHE=/mod -e GOCACHE=/mod/gocache -e CGO_ENABLED=1 \
            caddy:2.11.9-builder-alpine \
            sh -c 'apk add --no-cache gcc musl-dev && go test -race -count=1 ./...'

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build the image
        run: ./build.sh

      # The suite starts with a version check: the container must resolve the
      # same Caddy and SQLite driver that go.mod pins, or the tests are
      # exercising something other than what ships. It also boots the image on
      # its shipped config, so a broken default Caddyfile fails here.
      - name: run the end-to-end suite
        run: E2E_IMAGE=caddy-sqlite:test sh test/e2e.sh

      # Guard the license collection: stripped Go build info silently ships
      # zero dependency licenses, so count the directories instead of trusting
      # the Dockerfile step.
      - name: dependency licenses are present
        run: |
          count=$(docker run --rm --entrypoint /bin/sh caddy-sqlite:test \
            -c 'ls /usr/share/licenses/plugins | wc -l')
          echo "license directories: $count"
          if [ "$count" -lt 100 ]; then
            echo "the image is missing dependency licenses"
            exit 1
          fi
